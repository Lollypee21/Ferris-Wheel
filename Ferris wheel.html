<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Animated Ferris Wheel</title>
        <link href="ferris wheel.css" rel="stylesheet">
    </head>
    <body>
        <div class="sky">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>

           <div class="wheel">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                
                <div class="cabin"></div>
                <div class="cabin"></div>
                <div class="cabin"></div>
                <div class="cabin"></div>
                <div class="cabin"></div>
                <div class="cabin"></div>
            </div>

            <div class="lights">
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
            </div>
        </div>
    </div>
</div>

<div class="roller-coaster">
    <div class="track"></div>
    <div class="cart"></div>
</div>
<div class="balloon-container">
    <span class="balloon">
        <div class="rope"></div>
    </span>
    <span class="balloon">
        <div class="rope"></div>
    </span>
    <span class="balloon">
        <div class="rope"></div>
    </span>
    <span class="balloon">
        <div class="rope"></div>
    </span>
    <span class="balloon">
        <div class="rope"></div>
    </span>
</div>


<div class="ground"></div>
</div>
    </body>
</html>
